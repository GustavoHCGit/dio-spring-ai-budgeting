name: Build and test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: Build and unit tests (no external services)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Build and test without external services
        env:
          OPENAI_API_KEY: ''
        run: ./gradlew clean build --no-daemon
